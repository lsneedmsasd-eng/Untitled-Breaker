<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Block Breaker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>BLOCK BREAKER</h1>
    <canvas id="game" width="600" height="450" aria-label="Block Breaker game"></canvas>
    <p>Click a brick to aim. Move with ← → or A / D. Keep the paddle under falling shots; contact slows them.</p>
  </main>

  <!-- The order matters: game.js goes first because the other files use its settings. -->
  <script src="game.js"></script>
  <script src="bricks.js"></script>
  <script src="collisions.js"></script>
</body>
</html>
